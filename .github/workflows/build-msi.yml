name: Build Remote Agent MSI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go agent executable
        shell: pwsh
        env:
          GOARCH: amd64
          GOOS: windows
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force -Path installer\bin | Out-Null
          Set-Location agent-go
          go mod download
          Write-Host "Building RemoteAgent.exe..."
          go build -ldflags="-s -w" -o ..\installer\bin\RemoteAgent.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ..
          Get-ChildItem installer\bin\*.exe | ForEach-Object {
            Write-Host "Built: $($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)"
          }
      
      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build MSI
        shell: pwsh
        working-directory: ./installer
        run: |
          $wxs = (Resolve-Path "RemoteAgent.wxs").Path
          $wixobj = (Join-Path (Get-Location) "RemoteAgent.wixobj")
          $msi = (Join-Path (Get-Location) "RemoteAgent.msi")
          & candle.exe "-dSourceDir=." "-out" $wixobj $wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & light.exe $wixobj "-out" $msi "-ext" "WixUIExtension"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteAgent-MSI
          path: installer/RemoteAgent.msi
          retention-days: 30
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: installer/RemoteAgent.msi
          body: |
            # Remote Agent MSI Installer

            ## Features
            - Native Go executable - no Node.js or runtime required on target PC
            - Screen capture via Windows GDI APIs
            - Remote mouse and keyboard control via Win32 SendInput
            - Registers as a Windows service (auto-starts on boot, auto-restarts on crash)
            - Clean uninstall from Control Panel

            ## Installation
            1. Run RemoteAgent.msi as Administrator
            2. Follow the installer wizard
            3. Agent registers as a Windows service and connects to your RMM hub automatically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
